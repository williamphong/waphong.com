minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - eslint-import-resolver-typescript@3.10.1

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

overrides:
  '@opennextjs/cloudflare@<1.17.1': '>=1.17.1'
  fast-xml-parser@>=4.0.0-beta.3 <=5.5.5: '>=5.5.6'
  fast-xml-parser@>=5.0.0 <5.3.8: '>=5.3.8'
  flatted@<3.4.0: '>=3.4.0'
  js-yaml@>=4.0.0 <4.3.0: '>=4.3.0 <5.0.0'
  minimatch@<10.2.1: '>=10.2.1'
  minimatch@>=10.0.0 <10.2.3: '>=10.2.3'
  postcss@<8.5.18: '>=8.5.18 <9.0.0'
  sharp@<0.35.0: '>=0.35.0 <0.36.0'
  undici@>=7.0.0 <7.29.0: '>=7.29.0 <8.0.0'

minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - ws@8.21.0
  - form-data@4.0.6
