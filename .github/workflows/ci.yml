name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing useful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No version pin here: action-setup reads `packageManager` from
      # package.json, which is the same field Cloudflare's builder uses.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The gate that makes automerged lockfile refreshes safe. A refresh that
      # regressed a transitive dependency would restore a known-vulnerable
      # version and nothing else in this job would notice -- nanoid sat under
      # postcss with no direct dependency to bump.
      #
      # --ignore-unfixable reads like it belongs here and does not: on its own
      # it exits 0 on a *fixable* high. If an unfixable advisory ever blocks a
      # merge, add `--ignore GHSA-xxxx-xxxx-xxxx` so the exception shows up in
      # the diff rather than hiding in a flag.
      - run: pnpm audit --audit-level moderate --ignore-registry-errors

      - run: pnpm lint

      - run: pnpm format

      # The Cloudflare deploy runs `opennextjs-cloudflare build`, not
      # `next build`. Only this step would have caught the incremental-cache
      # misconfiguration that 404'd every blog post in production.
      - run: pnpm exec opennextjs-cloudflare build

      - run: pnpm exec playwright install --with-deps chromium

      # webServer in playwright.config.ts runs `next build && next start`.
      - run: pnpm test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
